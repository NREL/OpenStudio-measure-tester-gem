Gemspec/OrderedDependencies:
  Enabled: true


# This file was regenerated by Nicholas Long on 4/4/2025. 
# The version that was on AWS S3 is going to be removed, but should
# probably wait until 6 months after this is released to ensure 
# old versions are not still in use. (If you see this message after Jan 1, 2026,
# then remove this comment and delete the AWS rubocop configs.
#    http://s3.amazonaws.com/openstudio-resources/styles/
Layout:
  Severity: error
Lint:
  Severity: error
Metrics:
  Severity: error
Naming:
  Severity: warning   
Style:
  Severity: error
  
# ==================== Layout ====================
Layout/BlockAlignment:
  Enabled: true

# Need to allow indented case statements
# Configuration parameters: IndentWhenRelativeTo, SupportedStyles, IndentOneStep.
Layout/CaseIndentation:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: true

Layout/EmptyLines:
  Enabled: true

Layout/EmptyLinesAroundBlockBody:
  Enabled: true

Layout/EmptyLinesAroundClassBody:
  Enabled: true

Layout/EmptyLinesAroundExceptionHandlingKeywords:
  Enabled: true

Layout/EmptyLinesAroundMethodBody:
  Enabled: true

Layout/ExtraSpacing:
  Enabled: true

Layout/FirstArrayElementIndentation:
  Enabled: true

Layout/FirstHashElementIndentation:
  Enabled: true

Layout/LeadingCommentSpace:
  Enabled: true

# Allow long lines to encourage sufficiently
# detailed user-facing log messages.
Layout/LineLength:
  Enabled: true
  Max: 1200
  Severity: warning

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: aligned
  Enabled: true

Layout/SpaceAfterComma:
  Enabled: true

Layout/SpaceAroundOperators:
  Enabled: true

Layout/SpaceBeforeBlockBraces:
  Enabled: true

Layout/SpaceInsideBlockBraces:
  Enabled: true

Layout/TrailingEmptyLines:
  Enabled: true

Layout/TrailingWhitespace:
  Enabled: true

# ==================== Linters ====================
Lint/AmbiguousOperator:
  Enabled: true

Lint/AmbiguousRegexpLiteral:
  Enabled: true

Lint/DeprecatedClassMethods:
  Enabled: true

# Allow empty when branches to give
# a space to clearly document the
# reason that nothing is happening.
Lint/EmptyWhen:
  Enabled: false

Lint/MissingSuper:
  Enabled: true

Lint/NestedMethodDefinition:
  Enabled: true

Lint/ParenthesesAsGroupedExpression:
  Enabled: true

Lint/RequireParentheses:
  Enabled: true

Lint/RedundantRequireStatement:
  Enabled: true

Lint/RedundantStringCoercion:
  Enabled: true

Lint/SelfAssignment:
  Enabled: true

Lint/ShadowingOuterLocalVariable:
  Enabled: true

# NL 2020-05-03: Allow catching StandardError
# TC renamed from Lint/HandleExceptions to Lint/SuppressedException for v4 style
Lint/SuppressedException:
  Enabled: false

Lint/UnreachableCode:
  Enabled: false

# Disable checks for unused block arguments
Lint/UnusedBlockArgument:
  Enabled: false

# Disable checks for ununsed method arguments
Lint/UnusedMethodArgument:
  Enabled: false


# Allow variable initialization to indicate
# what variable is going to be set by the next
# block of code.
Lint/UselessAssignment:
  Enabled: false

# ==================== Metrics ====================
# NL 2020-05-03: Drastically increase the length of assignment branch condition
Metrics/AbcSize:
  Max: 250
  Enabled: true
  Severity: warning

# NL 2020-05-03: Quintuple the length of allowable blocks
Metrics/BlockLength:
  Max: 250
  Severity: warning
  Enabled: true

Metrics/BlockNesting:
  Max: 5
  Enabled: true

Metrics/ClassLength:
  Max: 500
  CountComments: false
  Severity: warning
  Enabled: true

# NL 2020-05-03: Increase the allowable cyclomatic complexity
Metrics/CyclomaticComplexity:
  Max: 100
  Severity: warning
  Enabled: true

Metrics/MethodLength:
  Max: 350
  CountComments: false
  Severity: warning
  Enabled: true

Metrics/ModuleLength:
  Max: 500
  CountComments: false
  Severity: warning

# Longer parameter list limits for methods that
# add HVAC systems
Metrics/ParameterLists:
  Max: 15
  Severity: warning
  Enabled: true

# NL 2020-05-03: increase tolerance
Metrics/PerceivedComplexity:
  Max: 100
  Severity: warning
  Enabled: true

# ==================== Naming ====================
# Intentionally allow set_foo because these methods do not
# have corresponding getters.
Naming/AccessorMethodName:
  Enabled: false

Naming/BlockParameterName:
  Enabled: true

Naming/ClassAndModuleCamelCase:
  Enabled: true

Naming/FileName:
  Enabled: true

Naming/MethodName:
  Enabled: true

Naming/MethodParameterName:
  Enabled: true

Naming/VariableName:
  Enabled: true

# Allow variables like coeff_1 for legibility
Naming/VariableNumber:
  Enabled: true

# ==================== Performance ====================
# These are disabled because they are in a separate gem.
# Performance` cops have been extracted to the `rubocop-performance` gem.

# NL 2020-05-03: match -> match? or =~ -> match? breaks certain OpenStudio measures.
# Performance/RegexpMatch:
#   Enabled: false

# NL 2020-05-03: Allow gsub (instead of the preferred tr)
# Performance/StringReplacement:
#   Enabled: false

# ==================== Security ====================
Security/Eval:
  Enabled: true

# ==================== Styles ====================
# Configuration parameters: EnforcedStyle, SupportedStyles.

Style/AccessorGrouping:
  Enabled: true

Style/AndOr:
  Enabled: true

Style/CaseLikeIf:
  Enabled: true

Style/ClassAndModuleChildren:
  Enabled: false

Style/ClassVars:
  Enabled: false

Style/ColonMethodCall:
  Enabled: true

Style/CombinableLoops:
  Enabled: true

Style/CommentAnnotation:
  Enabled: true

Style/CommentedKeyword:
  Enabled: true

# Allow this syntax -- do not autocorrect.
#   a = if true
#         1
#       else
#         2
#       end
Style/ConditionalAssignment:
  Enabled: false

# Documentation will be covered by YARD.
Style/Documentation:
  Enabled: false

Style/EachWithObject:
  Enabled: false

Style/EmptyElse:
  Enabled: true


Style/FloatDivision:
  Enabled: true

# Allow for i in 0..3 loops
Style/For:
  Enabled: false

Style/FormatString:
  Enabled: true

# NL 2020-05-08: Do not add the frozen_string_literal: true to the top of the files.
Style/FrozenStringLiteralComment:
  Enabled: false

# Configuration parameters: AllowedVariables.
Style/GlobalVars:
  Enabled: false

# Disabled because in most of this codebase, the current approach is more readable.
Style/GuardClause:
  Enabled: false

# Allow duplication inside conditional branches to keep
# code that does certain tasks more consolidated.
Style/IdenticalConditionalBranches:
  Enabled: false  

Style/HashEachMethods:
  Enabled: true

Style/HashSyntax:
  Enabled: true

# Allow this type of nesting for logic clarity.
Style/IfInsideElse:
  Enabled: false  

# Do not force people to use one-line if statements.
Style/IfUnlessModifier:
  Enabled: false

Style/InverseMethods:
  Enabled: true

Style/MethodCallWithoutArgsParentheses:
  Enabled: true

Style/MultilineIfThen:
  Enabled: true

# Allow multiple comparisons via || for clarity
Style/MultipleComparison:
  Enabled: false

# Allow negatives
# https://rubocop.readthedocs.io/en/latest/cops_style/#stylenegatedif
Style/NegatedIf:
  Enabled: false

# Do not force people to use Next.
Style/Next:
  Enabled: false

Style/Not:
  Enabled: true

# Do not convert 10000 to 10_000
Style/NumericLiterals:
  Enabled: false

# Do not force using .zero?
Style/NumericPredicate:
  Enabled: false

Style/OptionalBooleanParameter:
  Enabled: true

Style/PreferredHashMethods:
  Enabled: true

Style/RedundantFileExtensionInRequire:
  Enabled: true

Style/RedundantFreeze:
  Enabled: true

Style/RedundantParentheses:
  Enabled: true

Style/RedundantRegexpEscape:
  Enabled: true

# encourage explicit returns for clarity
Style/RedundantReturn:
  Enabled: false

Style/RegexpLiteral:
  Enabled: true

# Do NOT use &. for Safe Navigation
Style/SafeNavigation:
  Enabled: false

Style/SelfAssignment:
  Enabled: true

Style/SignalException:
  Enabled: true

Style/SlicingWithRange:
  Enabled: true

Style/SoleNestedConditional:
  Enabled: true

# Do NOT enable this because it appears $? is different than $CHILD_STATUS.
Style/SpecialGlobalVars:
  Enabled: false

Style/StringConcatenation:
  Enabled: true

Style/StringLiterals:
  Enabled: true

Style/StringLiteralsInInterpolation:
  Enabled: true

# Do not use %w, %W, %i, etc
# Prefer [:a, :b, :c] over %i[a b c]
Style/SymbolArray:
  EnforcedStyle: brackets
  Enabled: true

Style/SymbolProc:
  Enabled: true

Style/TrailingCommaInArrayLiteral:
  Enabled: true

Style/TrailingCommaInHashLiteral:
  Enabled: true

# Do not use %w, %W, %i, etc
# Prefer ['a', 'b', 'c'] over %w[a b c]
Style/WordArray:
  Enabled: true
  EnforcedStyle: brackets

Style/ZeroLengthPredicate:
  Enabled: true
  